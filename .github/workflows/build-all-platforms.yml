name: Build all platforms

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  linux-builds:
    name: Android, Linux, and Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test test/secure_storage_service_test.dart
      - run: flutter build apk --release
      - run: flutter build linux --release
      - run: flutter build web --release

  apple-builds:
    name: iOS and macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - run: flutter build macos --release

  windows-build:
    name: Windows
    runs-on: windows-latest
    env:
      CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build windows --release